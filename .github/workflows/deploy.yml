name: Deploy Frontend

# Deploys the Vite SPA to the AIC VPS after a successful push-triggered CI
# run on main. payrollmy.com is served by host Caddy from
# /opt/payrollmy-site (CloudFront+S3 was retired in the 2026-09-07 cutover).
#
# Required environment secret (GitHub environment "production"):
#   VPS_SSH_PRIVATE_KEY - private key accepted for root@162.19.81.122:20049

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: payroll-frontend-production
  cancel-in-progress: false

env:
  VPS_HOST: 162.19.81.122
  VPS_PORT: "20049"
  VPS_USER: root
  VPS_HOST_KEY: "[162.19.81.122]:20049 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIxenH95jfg3hxfkumJpZJyV7phwCNDrXrAL0wUXnta9"
  VITE_API_URL: https://api.payrollmy.com/api
  PUBLIC_DNS_CUTOVER: "true"
  SITE_DIR: /opt/payrollmy-site

jobs:
  gate:
    name: Select latest approved main commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.select.outputs.deploy }}
      sha: ${{ steps.select.outputs.sha }}

    steps:
      - name: Reject superseded CI runs
        id: select
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          latest_sha=$(git ls-remote --exit-code \
            "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk '{print $1}')
          printf 'sha=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$CANDIDATE_SHA" == "$latest_sha" ]]; then
            printf 'deploy=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'deploy=false\n' >> "$GITHUB_OUTPUT"
            echo "Skipping superseded commit $CANDIDATE_SHA; main is $latest_sha."
          fi

  deploy-frontend:
    name: Build and deploy to the AIC VPS
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_SHA: ${{ needs.gate.outputs.sha }}

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      - name: Build frontend
        working-directory: frontend
        run: |
          bun ci
          bun run build
          test -f dist/index.html

      - name: Configure pinned SSH access
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_PRIVATE_KEY"
          install -m 0600 /dev/null "$RUNNER_TEMP/vps-key"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vps-key"
          install -m 0600 /dev/null "$RUNNER_TEMP/vps-known-hosts"
          printf '%s\n' "$VPS_HOST_KEY" > "$RUNNER_TEMP/vps-known-hosts"
          ssh-keygen -lf "$RUNNER_TEMP/vps-known-hosts" \
            | grep -Fq 'SHA256:HV6OszvuYmwmWRLEY7z7jm8GojWZJppJlDBHIhJVUxw'

      - name: Upload SPA to the VPS
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/payroll-frontend-$DEPLOY_SHA.tar.gz"
          tar -C frontend/dist -czf "$bundle" .
          scp \
            -i "$RUNNER_TEMP/vps-key" \
            -P "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/vps-known-hosts" \
            "$bundle" \
            "$VPS_USER@$VPS_HOST:/tmp/payroll-frontend-$DEPLOY_SHA.tar.gz.part"

      - name: Activate the new site tree
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$RUNNER_TEMP/vps-key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/vps-known-hosts" \
            "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail
             trap 'rm -f /tmp/payroll-frontend-$DEPLOY_SHA.tar.gz.part /tmp/payroll-frontend-$DEPLOY_SHA.tar.gz' EXIT
             mv /tmp/payroll-frontend-$DEPLOY_SHA.tar.gz.part /tmp/payroll-frontend-$DEPLOY_SHA.tar.gz
             incoming=\$(mktemp -d /opt/payrollmy-site.incoming.XXXXXX)
             tar -xzf /tmp/payroll-frontend-$DEPLOY_SHA.tar.gz -C \"\$incoming\"
             test -f \"\$incoming/index.html\"
             rm -rf /opt/payrollmy-site.prev
             if [ -d $SITE_DIR ]; then mv $SITE_DIR /opt/payrollmy-site.prev; fi
             mv \"\$incoming\" $SITE_DIR
             chmod -R a+rX $SITE_DIR"

      - name: Verify public HTTPS once DNS has been cut over
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PUBLIC_DNS_CUTOVER" != "true" ]]; then
            echo "PUBLIC_DNS_CUTOVER is not true; the SPA was uploaded and public HTTPS was skipped."
            exit 0
          fi
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 5 --retry-all-errors \
            --max-time 20 \
            https://payrollmy.com/ >/dev/null
          echo "Public HTTPS health check passed through Cloudflare."

      - name: Remove ephemeral SSH key
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/vps-key" "$RUNNER_TEMP/vps-known-hosts"
