name: Deploy Backend

# Zero-incremental-cost deployment path:
#   public standard GitHub runner -> SSH/SCP -> AIC cloud VPS.
# No ECR, RDS, Secrets Manager, SSM, or paid cache. Mirrors the pattern
# already used by the hotel-app and online-shopping-platform repos, which
# share this same VPS.
#
# Required environment secret (GitHub environment "production"):
#   VPS_SSH_PRIVATE_KEY - private key accepted for root@162.19.81.122:20049
#
# The host is an LXC container with no public IPv4 of its own: 162.19.81.122 is
# shared, and only port 20049 forwards to this container's sshd. GitHub-hosted
# runners cannot reach the origin IPv6, so CI always uses the forwarded IPv4
# port. Pinned host-key fingerprint:
# SHA256:HV6OszvuYmwmWRLEY7z7jm8GojWZJppJlDBHIhJVUxw.

on:
  # Intentionally no workflow_dispatch: production revisions must enter through
  # a successful push-triggered CI run, never through an untested manual path.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: payroll-backend-production
  cancel-in-progress: false

env:
  VPS_HOST: 162.19.81.122
  VPS_PORT: '20049'
  VPS_USER: root
  VPS_HOST_KEY: '[162.19.81.122]:20049 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIxenH95jfg3hxfkumJpZJyV7phwCNDrXrAL0wUXnta9'
  PUBLIC_DNS_CUTOVER: 'true'

jobs:
  gate:
    name: Select latest approved commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.select.outputs.deploy }}
      sha: ${{ steps.select.outputs.sha }}
      branch: ${{ steps.select.outputs.branch }}

    steps:
      - name: Reject superseded CI runs
        id: select
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          latest_sha=$(git ls-remote --exit-code \
            "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$HEAD_BRANCH" | awk '{print $1}')
          printf 'sha=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          printf 'branch=%s\n' "$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          if [[ "$CANDIDATE_SHA" == "$latest_sha" ]]; then
            printf 'deploy=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'deploy=false\n' >> "$GITHUB_OUTPUT"
            echo "Skipping superseded commit $CANDIDATE_SHA; $HEAD_BRANCH is $latest_sha."
          fi

  build-backend:
    name: Build backend release bundle
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      bundle_sha256: ${{ steps.package.outputs.bundle_sha256 }}
      archive_bytes: ${{ steps.package.outputs.archive_bytes }}
    env:
      DEPLOY_SHA: ${{ needs.gate.outputs.sha }}

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Verify deployment revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build linux/amd64 backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          tags: 'payroll-backend:${{ env.DEPLOY_SHA }}'
          labels: 'org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}'
          build-args: |
            GIT_SHA=${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=backend-docker
          cache-to: type=gha,mode=max,scope=backend-docker

      - name: Verify built backend image architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' \
            "payroll-backend:$DEPLOY_SHA")" = "linux/amd64"

      - name: Create checksummed release bundle
        id: package
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="$RUNNER_TEMP/payroll-release"
          bundle_path="$RUNNER_TEMP/payroll-$DEPLOY_SHA.tar.gz"
          mkdir -p "$bundle_dir/images"

          docker save "payroll-backend:$DEPLOY_SHA" | gzip -1 > "$bundle_dir/images/backend.tar.gz"

          cp deploy/deploy.sh "$bundle_dir/deploy.sh"
          cp deploy/docker-compose.prod.yml "$bundle_dir/docker-compose.prod.yml"
          cp deploy/migrate-database.sh "$bundle_dir/migrate-database.sh"
          # deploy.sh refuses to start unless these units are in the tarball.
          cp deploy/payroll-backup.sh "$bundle_dir/payroll-backup.sh"
          cp deploy/payroll-backup.service "$bundle_dir/payroll-backup.service"
          cp deploy/payroll-backup.timer "$bundle_dir/payroll-backup.timer"
          cp deploy/payroll-watchdog.sh "$bundle_dir/payroll-watchdog.sh"
          cp deploy/payroll-watchdog.service "$bundle_dir/payroll-watchdog.service"
          cp deploy/payroll-watchdog.timer "$bundle_dir/payroll-watchdog.timer"
          for payload in deploy.sh docker-compose.prod.yml payroll-backup.sh \
                         payroll-backup.service payroll-backup.timer \
                         payroll-watchdog.sh payroll-watchdog.service payroll-watchdog.timer; do
            test -f "$bundle_dir/$payload"
          done

          (
            cd "$bundle_dir"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
          tar -C "$bundle_dir" -czf "$bundle_path" .
          ls -lh "$bundle_path"
          bundle_sha256=$(sha256sum "$bundle_path" | awk '{print $1}')
          archive_bytes=$(wc -c < "$bundle_path" | tr -d ' ')
          printf 'bundle_sha256=%s\narchive_bytes=%s\n' "$bundle_sha256" "$archive_bytes" >> "$GITHUB_OUTPUT"

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-bundle-${{ needs.gate.outputs.sha }}
          path: ${{ runner.temp }}/payroll-${{ needs.gate.outputs.sha }}.tar.gz
          retention-days: 1

  deploy:
    name: Deploy bundle to the AIC VPS
    needs: [gate, build-backend]
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
      HEAD_BRANCH: ${{ needs.gate.outputs.branch }}
      BUNDLE_SHA256: ${{ needs.build-backend.outputs.bundle_sha256 }}
      ARCHIVE_BYTES: ${{ needs.build-backend.outputs.archive_bytes }}

    steps:
      - name: Download release bundle artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-bundle-${{ needs.gate.outputs.sha }}
          path: ${{ runner.temp }}/bundle

      - name: Verify release bundle checksum
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ARCHIVE_BYTES" =~ ^[0-9]+$ ]]
          archive="$RUNNER_TEMP/bundle/payroll-$DEPLOY_SHA.tar.gz"
          test -f "$archive"
          printf '%s  %s\n' "$BUNDLE_SHA256" "$archive" | sha256sum --check --status -

      - name: Configure pinned SSH access
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_PRIVATE_KEY"
          install -m 0600 /dev/null "$RUNNER_TEMP/vps-key"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vps-key"
          install -m 0600 /dev/null "$RUNNER_TEMP/vps-known-hosts"
          printf '%s\n' "$VPS_HOST_KEY" > "$RUNNER_TEMP/vps-known-hosts"
          ssh-keygen -lf "$RUNNER_TEMP/vps-known-hosts" \
            | grep -Fq 'SHA256:HV6OszvuYmwmWRLEY7z7jm8GojWZJppJlDBHIhJVUxw'

      - name: Verify protected VPS disk capacity
        shell: bash
        run: |
          set -euo pipefail
          required_bytes=$((4294967296 + (ARCHIVE_BYTES * 2)))
          ssh \
            -i "$RUNNER_TEMP/vps-key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/vps-known-hosts" \
            "$VPS_USER@$VPS_HOST" \
            "set -eu
             install -d -m 0700 -o root -g root /opt/payroll /opt/payroll/.incoming
             available=\$(df --output=avail -B1 /opt/payroll | tail -n 1 | tr -d ' ')
             if [ \"\$available\" -lt $required_bytes ]; then
               echo \"Insufficient free space on /opt/payroll for a protected deployment\" >&2
               exit 1
             fi"

      - name: Upload release directly to private VPS staging directory
        shell: bash
        run: |
          set -euo pipefail
          scp \
            -i "$RUNNER_TEMP/vps-key" \
            -P "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/vps-known-hosts" \
            "$RUNNER_TEMP/bundle/payroll-$DEPLOY_SHA.tar.gz" \
            "$VPS_USER@$VPS_HOST:/opt/payroll/.incoming/payroll-$DEPLOY_SHA.tar.gz.part"

      - name: Deploy and wait for health checks
        shell: bash
        run: |
          set -euo pipefail
          # The image can take a while to build. Recheck after upload and
          # immediately before touching production so a CI run that became
          # stale after the gate cannot deploy an older main revision.
          latest_sha=$(git ls-remote --exit-code \
            "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$HEAD_BRANCH" | awk '{print $1}')
          [[ "$latest_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$DEPLOY_SHA" != "$latest_sha" ]]; then
            echo "Refusing stale deployment $DEPLOY_SHA; $HEAD_BRANCH is now $latest_sha." >&2
            exit 1
          fi

          ssh \
            -i "$RUNNER_TEMP/vps-key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/vps-known-hosts" \
            "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail
             staging='/opt/payroll/.incoming'
             archive=\"\$staging/payroll-$DEPLOY_SHA.tar.gz\"
             trap 'rm -f -- \"\$archive.part\" \"\$archive\"' EXIT
             printf '%s  %s\n' '$BUNDLE_SHA256' \"\$archive.part\" | sha256sum --check --status -
             mv \"\$archive.part\" \"\$archive\"
             rm -rf -- /opt/payroll/releases/$DEPLOY_SHA.incoming
             install -d -m 0750 /opt/payroll/releases/$DEPLOY_SHA.incoming
             tar --no-same-owner --no-same-permissions -xzf \"\$archive\" -C /opt/payroll/releases/$DEPLOY_SHA.incoming
             rm -rf -- /opt/payroll/releases/$DEPLOY_SHA
             mv /opt/payroll/releases/$DEPLOY_SHA.incoming /opt/payroll/releases/$DEPLOY_SHA
             /bin/bash /opt/payroll/releases/$DEPLOY_SHA/deploy.sh \
               $DEPLOY_SHA /opt/payroll/releases/$DEPLOY_SHA"

      - name: Authenticated-shaped business smoke (plan item 35)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PUBLIC_DNS_CUTOVER" != "true" ]]; then
            echo "PUBLIC_DNS_CUTOVER is not true; business smoke skipped."
            exit 0
          fi
          # /api/health/ready already proves DB + config. This proves routing,
          # rate limiting and the auth surface are live: a login attempt for a
          # nonexistent account must be REFUSED — never 200, never a bare "ok",
          # never a 500. 401/422 answer a credential check; 400/403 are the
          # Turnstile gate refusing a request that carries no token; 429 is the
          # login rate limiter.
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 20 \
            -X POST https://api.payrollmy.com/api/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"smoke-probe@example.invalid","password":"wrong"}')
          echo "login probe answered $code"
          case "$code" in
            400|401|403|422|429) ;;
            *) echo "unexpected login probe status: $code"; exit 1 ;;
          esac

      - name: Verify loopback revision and public HTTPS once DNS has been cut over
        shell: bash
        run: |
          set -euo pipefail
          host_ready=$(ssh \
            -i "$RUNNER_TEMP/vps-key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/vps-known-hosts" \
            "$VPS_USER@$VPS_HOST" \
            "curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/api/health/ready")
          if ! grep -Eq '"status"[[:space:]]*:[[:space:]]*"(ready|degraded)"' <<<"$host_ready"; then
            echo "Host readiness status check failed: $host_ready" >&2
            exit 1
          fi
          local_ready=$(ssh \
            -i "$RUNNER_TEMP/vps-key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/vps-known-hosts" \
            "$VPS_USER@$VPS_HOST" \
            "docker exec payroll-backend curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/api/health/ready")
          if ! grep -Eq "\"revision\"[[:space:]]*:[[:space:]]*\"${DEPLOY_SHA}\"" <<<"$local_ready"; then
            echo "Loopback readiness revision mismatch (expected $DEPLOY_SHA): $local_ready" >&2
            exit 1
          fi
          if [[ "$PUBLIC_DNS_CUTOVER" != "true" ]]; then
            echo "PUBLIC_DNS_CUTOVER is not true; localhost revision check passed and public HTTPS was skipped."
            exit 0
          fi
          ready_body=$(curl --fail --silent --show-error \
            --retry 20 --retry-delay 5 --retry-all-errors \
            --max-time 20 \
            https://api.payrollmy.com/api/health/ready)
          if ! grep -Eq '"status"[[:space:]]*:[[:space:]]*"(ready|degraded)"' <<<"$ready_body"; then
            echo "Public readiness status check failed: $ready_body" >&2
            exit 1
          fi
          echo "Loopback revision ($DEPLOY_SHA) and public HTTPS readiness checks passed through Cloudflare."

      - name: Remove remote transfer files
        if: always()
        shell: bash
        run: |
          if [[ -s "$RUNNER_TEMP/vps-key" && -s "$RUNNER_TEMP/vps-known-hosts" ]]; then
            ssh \
              -i "$RUNNER_TEMP/vps-key" \
              -p "$VPS_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$RUNNER_TEMP/vps-known-hosts" \
              "$VPS_USER@$VPS_HOST" \
              "rm -f -- /opt/payroll/.incoming/payroll-$DEPLOY_SHA.tar.gz.part /opt/payroll/.incoming/payroll-$DEPLOY_SHA.tar.gz" \
              || true
          fi

      - name: Remove ephemeral SSH key
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/vps-key" "$RUNNER_TEMP/vps-known-hosts"
