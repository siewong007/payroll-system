version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'cargo'
    directory: '/backend'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'bun'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'

  - package-ecosystem: 'docker'
    directory: '/infra'
    schedule:
      interval: 'weekly'
