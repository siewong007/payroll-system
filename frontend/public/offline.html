<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B2E4B" />
    <title>PayrollMY — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #eef2f7;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --border: rgba(15, 23, 42, 0.08);
        --accent: #1b2e4b;
        --accent-hover: #253f66;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1120;
          --card: #111827;
          --text: #f1f5f9;
          --muted: #94a3b8;
          --border: rgba(148, 163, 184, 0.16);
          --accent: #4f46e5;
          --accent-hover: #4338ca;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 24rem;
        padding: 2rem 1.75rem;
        text-align: center;
        background-color: var(--card);
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        box-shadow: 0 18px 40px -18px rgba(15, 23, 42, 0.25);
      }

      .icon {
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 1rem;
        margin: 0 auto 1.25rem;
        display: block;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
        line-height: 1.3;
      }

      p {
        margin: 0 0 1.5rem;
        font-size: 0.9375rem;
        line-height: 1.5;
        color: var(--muted);
      }

      .retry {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0.625rem 1.5rem;
        border-radius: 0.75rem;
        background-color: var(--accent);
        color: #ffffff;
        font-size: 0.9375rem;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 0.15s ease;
      }

      .retry:hover,
      .retry:focus-visible {
        background-color: var(--accent-hover);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="icon" src="/icons/icon-192.png" alt="PayrollMY" width="72" height="72" />
      <h1>You're offline</h1>
      <p>Check your internet connection and try again to load PayrollMY.</p>
      <a class="retry" href="/">Try again</a>
    </main>
  </body>
</html>
